<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UNI-VERSE | Reset password</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="simple-page">
  <main class="form-card">
    <a class="back-link" href="./index.html">← Back to sign in</a>
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Reset your password</h1>
    <p class="muted">Enter the email address linked to your UNI-VERSE account. We'll send you a secure reset link.</p>
    <form id="request-form">
      <label>Email address
        <input id="reset-email" type="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <button class="btn primary" type="submit">Send reset link</button>
      <p id="request-message" class="message" role="status"></p>
    </form>
  </main>
  <script type="module" src="./assets/js/reset-password.js"></script>
</body>
</html>
