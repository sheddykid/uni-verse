<!doctype html>
<html lang="en" data-theme="light" data-theme-lock="light">
<head>
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20261124">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>UNI-VERSE | Reset password</title>
<script src="./assets/js/theme-init.js?v=theme-lock-20261125"></script>
<link rel="stylesheet" href="./assets/css/styles.css?v=theme-lock-20261125">
</head>
<body class="simple-page">
  <main class="form-card">
    <a class="back-link" href="./index.html">← Back to sign in</a>
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Reset your password</h1>
    <p class="muted">Enter your account email. We'll send a six-digit verification code.</p>
    <form id="request-form">
      <label>Email address
        <input id="reset-email" type="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <button class="btn primary" type="submit">Send verification code</button>
      <p id="request-message" class="message" role="status" aria-live="polite"></p>
    </form>
    <form id="verify-form" hidden>
      <label>Six-digit verification code
        <input id="recovery-otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
      </label>
      <p id="recovery-countdown" class="muted">Code expires in 10:00.</p>
      <button class="btn primary" type="submit">Verify code</button>
      <button class="btn secondary" id="resend-code" type="button" disabled>Resend code (60s)</button>
      <p id="verify-message" class="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script type="module" src="./assets/js/reset-password.js"></script>
  <script type="module" src="./assets/js/theme.js?v=theme-lock-20261125"></script>
</body>
</html>
