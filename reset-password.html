<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UNI-VERSE | Reset password</title>
  <script>
  try {
    const savedTheme = localStorage.getItem("uni-verse-theme");
    document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
  } catch {
    document.documentElement.dataset.theme = "light";
  }
</script>
<style>html[data-theme="dark"]{color-scheme:dark;background:#0b1120}html[data-theme="dark"] body{background:#0b1120;color:#e7ecf6}</style>
<link rel="stylesheet" href="./assets/css/styles.css?v=theme-fix-20261124">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="simple-page">
  <main class="form-card">
    <a class="back-link" href="./index.html">← Back to sign in</a>
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Reset your password</h1>
    <p class="muted">Enter the email address linked to your UNI-VERSE account. We'll send you a secure reset link.</p>
    <form id="request-form">
      <label>Email address
        <input id="reset-email" type="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <button class="btn primary" type="submit">Send reset link</button>
      <p id="request-message" class="message" role="status"></p>
    </form>
  </main>
  <script type="module" src="./assets/js/reset-password.js"></script>
<script type="module" src="./assets/js/theme.js"></script></body>
</html>
