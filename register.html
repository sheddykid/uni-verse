<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNI-VERSE | Register</title><link rel="stylesheet" href="./assets/css/styles.css"><style>#register-form .terms-consent{display:grid!important;grid-template-columns:18px minmax(0,1fr)!important;align-items:start!important;justify-content:start!important;gap:10px!important;width:100%;margin:0;text-align:left}#register-form .terms-consent input[type="checkbox"]{display:block!important;grid-column:1;grid-row:1;width:18px!important;height:18px!important;min-width:18px;padding:0!important;margin:3px 0 0!important;justify-self:start!important;align-self:start!important}#register-form .terms-consent label{display:block!important;grid-column:2;grid-row:1;min-width:0;text-align:left;line-height:1.45}</style></head><body class="simple-page"><main class="form-card wide"><a class="back-link" href="./index.html">← Back to sign in</a><p class="eyebrow">GET STARTED</p><h1>Create your student account</h1><p class="muted">Register with your Covenant University details.</p><form id="register-form"><div class="field-grid"><label>Full name<input id="full-name" required autocomplete="name"></label><label>Matriculation number<input id="matric" required placeholder="e.g. 23CJ000000"></label><label>Email address<input id="email" type="email" required autocomplete="email"></label><label>Department<select id="department" required><option value="">Loading departments…</option></select></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input id="confirm-password" type="password" required minlength="8" autocomplete="new-password"></label></div><div class="terms-consent"><input id="verification-terms" type="checkbox" required><label for="verification-terms">I have read and agree to the <a href="./terms-and-conditions.html" target="_blank" rel="noopener noreferrer">Terms and Conditions</a>, involving the student verification.</label></div><button class="btn primary" type="submit">Create account</button><p id="message" class="message" role="status"></p></form><p class="form-foot">Already registered? <a href="./index.html">Sign in</a></p></main><script type="module" src="./assets/js/register.js"></script><script type="module" src="./assets/js/theme.js"></script></body></html>
