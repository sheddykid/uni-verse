<html lang="en" data-theme="light" data-theme-lock="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb">
<title>UNI-VERSE | Verify email</title>

<body class="simple-page">
<main class="form-card">
<a class="back-link" href="./register.html">← Back to registration</a>
<p class="eyebrow">EMAIL VERIFICATION</p>
<h1>Check your inbox</h1>
<p class="muted" id="verify-description">Enter the six-digit code sent to your email address.</p>
<form id="verify-form">
<label for="otp">Six-digit verification code<input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label>
<button class="btn primary" type="submit">Verify email</button>
<p class="message" id="message" role="status" aria-live="polite"></p>
</form>
<p class="form-foot">Didn't receive a code? <button class="btn secondary" id="resend-code" type="button">Resend code</button></p>
</main>
<script type="module" src="./assets/js/verify-email.js?v=email-fix-20261128"></script>
