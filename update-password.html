<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UNI-VERSE | Choose a new password</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="simple-page">
  <main class="form-card">
    <a class="back-link" href="./index.html">← Back to sign in</a>
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Choose a new password</h1>
    <p class="muted">Enter and confirm your new password below.</p>

    <form id="update-form" hidden>
      <label>New password
        <input id="new-password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <label>Confirm new password
        <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <button class="btn primary" type="submit">Update password</button>
    </form>
    <p id="update-message" class="message" role="status">Verifying your password reset link…</p>
  </main>
  <script type="module" src="./assets/js/update-password.js"></script>
<script type="module" src="./assets/js/theme.js"></script></body>
</html>
